<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>EPS Joliot Curie - Acrosport</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f1f4f9;
  --card:#ffffff;
  --ink:#1c2433;
  --muted:#6b7686;
  --border:#e1e6ee;
  --brand:#5b4ddb;
  --brand-dark:#4336b8;
  --brand-light:#eceaff;
  --accent:#ff7a59;
  --i:#e02020; --i-bg:#fdecea;
  --f:#ff8f00; --f-bg:#fff3e0;
  --s:#1b6b2d; --s-bg:#9fe3ab;
  --tb:#4ea100; --tb-bg:#b6ff1a;
  --radius:14px;
  --shadow:0 2px 10px rgba(30,40,70,.07), 0 1px 2px rgba(30,40,70,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:14.5px;
  line-height:1.35;
}
h1,h2,h3,h4{margin:0;}
button,input,select,textarea{font-family:inherit;font-size:inherit;}
button{cursor:pointer;}
a{color:var(--brand-dark);}

/* ===== Header ===== */
header.topbar{
  background:linear-gradient(120deg,var(--brand),var(--brand-dark) 70%);
  color:#fff;
  padding:12px 18px;
  position:sticky;top:0;z-index:50;
  box-shadow:var(--shadow);
  display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;
}
header.topbar .title{display:flex;align-items:center;gap:10px;}
header.topbar .title .logo{
  width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
header.topbar h1{font-size:18px;font-weight:700;letter-spacing:.2px;}
header.topbar .sub{font-size:11.5px;opacity:.85;margin-top:1px;}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.btn{
  border:1px solid var(--border);background:#fff;color:var(--ink);
  padding:7px 12px;border-radius:9px;font-weight:600;font-size:12.5px;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;
}
.btn:hover{background:var(--brand-light);border-color:var(--brand);}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35);}
.btn.ghost:hover{background:rgba(255,255,255,.25);}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand-dark);}
.btn.primary:hover{background:var(--brand-dark);}
.btn.danger{background:#fff;color:var(--i);border-color:var(--i);}
.btn.danger:hover{background:var(--i-bg);}
.btn.small{padding:4px 9px;font-size:11.5px;border-radius:7px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
#saveIndicator{font-size:11px;opacity:.8;}

/* ===== Level tabs ===== */
.levelTabs{display:flex;gap:8px;padding:10px 16px 0;}
.levelTab{
  padding:9px 20px;border-radius:12px 12px 0 0;font-weight:700;font-size:14px;
  background:#dfe3ee;color:var(--muted);border:1px solid var(--border);border-bottom:none;
  cursor:pointer;
}
.levelTab.active{background:var(--card);color:var(--brand-dark);box-shadow:0 -2px 8px rgba(0,0,0,.04);}

main{padding:0 16px 40px;max-width:1500px;margin:0 auto;}

/* ===== Class sub-tabs ===== */
.classTabsBar{
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  background:var(--card);border:1px solid var(--border);border-radius:0 0 var(--radius) var(--radius);
  padding:10px 12px;box-shadow:var(--shadow);margin-bottom:14px;
}
.classTab{
  padding:7px 14px;border-radius:999px;font-weight:600;font-size:12.5px;
  background:#f3f4fa;color:var(--ink);border:1px solid var(--border);cursor:pointer;
}
.classTab.active{background:var(--class-bg,var(--brand));color:#fff;border-color:var(--class-border,var(--brand-dark));}
.classTab.exigences{background:#fff3e0;border-color:#ffcc80;color:#b45309;}
.classTab.exigences.active{background:var(--accent);color:#fff;border-color:#e0603c;}
.classTabsBar .spacer{flex:1;}

/* ===== Horizontal sub-tabs (within a class / section) ===== */
.subTabBar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.subTab{padding:8px 15px;border-radius:10px;font-weight:700;font-size:12.5px;background:#f3f4fa;color:var(--ink);border:1px solid var(--border);cursor:pointer;white-space:nowrap;}
.subTab:hover{background:var(--brand-light);}
.subTab.active{background:var(--class-bg,var(--brand));color:#fff;border-color:var(--class-border,var(--brand-dark));}
.subTab.small2{padding:6px 11px;font-size:11.5px;}

.plainSectionTitle{font-size:12.5px;margin-bottom:6px;color:var(--muted);cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;}
.plainSectionTitle:hover{color:var(--brand-dark);}
.plainSectionTitle .chev2{display:inline-block;transition:transform .15s;font-size:10px;color:var(--brand);}
.plainSectionTitle.open .chev2{transform:rotate(90deg);}

/* ===== Accordion ===== */
.acc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;}
.acc-head{
  display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none;
  background:linear-gradient(90deg,#fafbff,#fff);
}
.acc-head:hover{background:var(--brand-light);}
.acc-head .chev{transition:transform .18s;color:var(--brand);font-size:13px;}
.acc.open > .acc-head .chev{transform:rotate(90deg);}
.acc-head h3{font-size:14.5px;font-weight:700;flex:1;}
.acc-head .meta{font-size:11.5px;color:var(--muted);font-weight:500;}
.acc-body{padding:14px 16px 16px;border-top:1px solid var(--border);}
.acc:not(.open) > .acc-body{display:none;}

.acc.nested{box-shadow:none;border-color:var(--border);margin-bottom:8px;}
.acc.nested > .acc-head{padding:9px 12px;background:#f7f8fc;}
.acc.nested > .acc-head h3{font-size:13px;}

/* ===== Badges (niveaux) ===== */
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  padding:3px 10px;border-radius:7px;font-weight:800;font-size:11.5px;letter-spacing:.3px;
  min-width:30px;text-align:center;border:1px solid transparent;
}
.badge-I{background:var(--i-bg);color:var(--i);border-color:#f8c9c6;}
.badge-F{background:var(--f-bg);color:var(--f);border-color:#ffd8a8;}
.badge-S{background:var(--s-bg);color:var(--s);border-color:#b7e2ba;}
.badge-TB{background:var(--tb-bg);color:var(--tb);border-color:#a9e000;}
.badge-none{background:#eee;color:#999;}

/* ===== Tables ===== */
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:left;}
th{background:#f7f8fc;font-weight:700;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0;z-index:4;}
tbody tr:nth-child(even){background:#f5f6fb;}
tbody tr:hover{background:#eceaff;}
.table-wrap{overflow-x:auto;max-height:480px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;}

/* ===== Forms ===== */
.field{display:flex;flex-direction:column;gap:3px;}
.field label{font-size:11px;font-weight:700;color:var(--muted);}
input[type=text],input[type=number],input[type=date],select,textarea{
  border:1px solid var(--border);border-radius:8px;padding:6px 9px;background:#fff;color:var(--ink);
}
input[type=checkbox]{width:16px;height:16px;cursor:pointer;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.grid{display:grid;gap:10px;}

/* ===== Cards / groupes ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;}
.gcard{border:1px solid var(--border);border-radius:12px;padding:10px;background:#fafbff;}
.gcard.unassigned{background:#fff6e9;border-color:#ffcc80;}
.gcard.poolSelected{background:var(--brand-light);border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-light);}
.gcard h4{font-size:12.5px;margin-bottom:6px;color:var(--brand-dark);display:flex;justify-content:space-between;align-items:center;}
.gcard .member{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:12.5px;border-bottom:1px dashed #e7e9f2;}
.gcard .member:last-child{border-bottom:none;}
.gcard.dropTarget{cursor:pointer;}
.gcard.dropTarget:hover{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-light);}
.gcard.newGroupTile{display:flex;align-items:center;justify-content:center;cursor:pointer;border-style:dashed;color:var(--brand-dark);font-weight:700;min-height:60px;}
.gcard.newGroupTile:hover{background:var(--brand-light);}
.eleveChip{display:inline-flex;align-items:center;padding:2px 7px;border-radius:7px;cursor:pointer;border:1.5px solid transparent;}
.eleveChip:hover{background:#eef0fa;}
.eleveChip.selected{background:var(--brand);color:#fff;border-color:var(--brand-dark);}
.member .removeMember{border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 3px;}
.member .removeMember:hover{color:var(--i);}

.figGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;}
.figThumb{border:2px solid var(--border);border-radius:10px;padding:4px;text-align:center;cursor:pointer;background:#fff;transition:.12s;}
.figThumb img{width:100%;height:60px;object-fit:cover;border-radius:6px;}
.figThumb .name{font-size:10.5px;margin-top:3px;font-weight:600;color:var(--muted);word-break:break-word;}
.figThumb.selected{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-light);}

.valTable td.valcell{text-align:center;cursor:pointer;}
.valcheck{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:transparent;}
.valcheck.done{background:var(--s);border-color:var(--s);color:#fff;}

.critList{display:flex;flex-direction:column;gap:5px;}
.critItem{display:flex;align-items:center;gap:8px;}
.critItem input[type=text]{flex:1;}
.tierRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.tierEdit{display:flex;align-items:center;gap:5px;background:#f7f8fc;border:1px solid var(--border);border-radius:8px;padding:4px 8px;}
.tierEdit input{width:46px;text-align:center;}

.descChip{border:1px solid var(--border);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:12px;background:#fff;max-width:230px;}
.descChip.active-TB{background:var(--tb-bg);border-color:var(--tb);}
.descChip.active-S{background:var(--s-bg);border-color:var(--s);}
.descChip.active-F{background:var(--f-bg);border-color:var(--f);}
.descChip.active-I{background:var(--i-bg);border-color:var(--i);}
.tierPick{min-width:46px;max-width:52px;text-align:center;font-weight:800;padding:6px 0;}

.studentEvalRow{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid #f0f1f7;flex-wrap:wrap;}
.studentEvalRow .sname{min-width:160px;font-weight:600;font-size:12.5px;}

/* ===== Modal ===== */
.modalOverlay{position:fixed;inset:0;background:rgba(20,24,40,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modalBox{background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modalHead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);}
.modalHead h3{font-size:16px;}
.modalBody{padding:16px 18px;}
.modalClose{border:none;background:none;font-size:20px;color:var(--muted);cursor:pointer;}
.tabsline{display:flex;gap:6px;margin-bottom:10px;}
.tabsline button{flex:1;}
.tabsline button.on{background:var(--brand);color:#fff;border-color:var(--brand-dark);}

.hint{font-size:11.5px;color:var(--muted);background:#f7f8fc;border:1px dashed var(--border);border-radius:8px;padding:8px 10px;}
.pill{background:var(--brand-light);color:var(--brand-dark);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;}
.emptyState{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px;}
.cropWrap{position:relative;display:inline-block;max-width:100%;touch-action:none;}
.cropWrap canvas{max-width:100%;border:1px solid var(--border);border-radius:8px;cursor:crosshair;}
.bankGallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px;}
.bankItem{border:1px solid var(--border);border-radius:10px;padding:6px;text-align:center;background:#fafbff;position:relative;}
.bankItem img{width:100%;height:65px;object-fit:cover;border-radius:6px;}
.bankItem .del{position:absolute;top:2px;right:2px;background:#fff;border:1px solid var(--border);border-radius:50%;width:20px;height:20px;font-size:11px;line-height:1;color:var(--i);}
.recapTable th,.recapTable td{white-space:nowrap;}

.evalResultsTable td,.evalResultsTable th{text-align:center;}
.evalResultsTable td.nameCell{text-align:left;font-weight:600;}
.evalResultsTable td.grCell{font-weight:800;color:var(--brand-dark);background:#f7f8fc;}

/* Colonne de gauche (Groupe/GR/Élève) figée au défilement horizontal */
.valTable th:first-child,.valTable td:first-child,
.evalResultsTable th:first-child,.evalResultsTable td:first-child,
.recapTable th:first-child,.recapTable td:first-child{
  position:sticky;
  left:0;
  z-index:2;
  background:#fff;
  box-shadow:2px 0 5px -3px rgba(20,24,40,.3);
}
.valTable thead th:first-child,
.evalResultsTable thead th:first-child,
.recapTable thead th:first-child{
  z-index:3;
  background:#f7f8fc;
}
.evalResultsTable td.grCell:first-child{ background:#f7f8fc; }
.tdTier-I{background:var(--i-bg);color:var(--i);font-weight:700;}
.tdTier-F{background:var(--f-bg);color:var(--f);font-weight:700;}
.tdTier-S{background:var(--s-bg);color:var(--s);font-weight:700;}
.tdTier-TB{background:var(--tb-bg);color:var(--tb);font-weight:700;}
.ordreBtn{border:1px solid var(--border);background:#fff;border-radius:5px;width:18px;height:18px;line-height:1;font-size:10px;cursor:pointer;padding:0;}
.ordreBtn:disabled{opacity:.25;cursor:default;}

@media (max-width:820px){
  body{font-size:13.5px;}
  header.topbar h1{font-size:15px;}
  .classTab{font-size:11.5px;padding:6px 10px;}
  .table-wrap{max-height:360px;}
}
footer.app-foot{text-align:center;color:var(--muted);font-size:11px;padding:16px 0 30px;}
</style>
</head>
<body>

<header class="topbar">
  <div class="title">
    <div class="logo">🤸</div>
    <div>
      <h1>EPS Joliot Curie — Acrosport</h1>
      <div class="sub">Suivi &amp; évaluation des séances en direct</div>
    </div>
  </div>
  <div class="toolbar">
    <span id="saveIndicator"></span>
    <span id="syncIndicator" style="font-size:11px;opacity:.9;"></span>
    <button class="btn ghost" onclick="App.exportData()">⬇️ Exporter</button>
    <button class="btn ghost" onclick="App.importDataFile()">⬆️ Importer</button>
    <button class="btn ghost" onclick="App.resetAllConfirm()">🗑️ Réinitialiser</button>
  </div>
</header>

<div class="levelTabs" id="levelTabs"></div>

<main id="app"></main>

<footer class="app-foot">Données enregistrées automatiquement sur cet appareil (navigateur), et synchronisées via le cloud entre vos appareils. « ⬇️ Exporter / ⬆️ Importer » restent disponibles pour une sauvegarde manuelle.</footer>

<input type="file" id="hiddenFileInput" accept="application/json" style="display:none">
<input type="file" id="hiddenCsvInput" accept=".csv,.tsv,text/csv,text/plain" style="display:none">
<input type="file" id="hiddenImgInput" accept="image/*" style="display:none">
<input type="file" id="hiddenFigureInput" accept="image/*" multiple style="display:none">

<div id="modalRoot"></div>

<script>
"use strict";

/* =========================================================================
   DONNEES PAR DEFAUT (barèmes / critères issus du cahier des charges)
   ========================================================================= */
const TIER_LABELS = ["TB","S","F","I"];

function defaultTiers(tb,s,f,i){
  return [
    {l:"TB",min:tb},
    {l:"S",min:s},
    {l:"F",min:f},
    {l:"I",min:i},
  ];
}
function cloneDeep(o){ return JSON.parse(JSON.stringify(o)); }

const LEVEL_DEFAULTS = {
  "4eme": {
    label: "4ème",
    seanceDefaults: {
      4: {
        nbFigures: { tiers: defaultTiers(4,2,1,0) },
        liaisons: { criteres:["Liaisons","Pas de gestes parasites","Concentration"], tiers: defaultTiers(3,2,1,0) }
      },
      5: {
        nbFigures: { tiers: defaultTiers(6,4,2,0) },
        liaisons: { criteres:["Liaisons","Pas de gestes parasites","Concentration"], tiers: defaultTiers(3,2,1,0) },
        projetCollectif: { criteres:["Coordination","Entrée et fin immobile","Enchaînement continu"], tiers: defaultTiers(3,2,1,0) }
      }
    },
    gym: {
      rouladeAvant: { legend:[
        {l:"TB",text:"3 critères validés : Dans l'axe, Se relève équilibré sans les mains, Pieds et jambes serrés pendant toute la roulade"},
        {l:"S",text:"2 critères validés"},{l:"F",text:"1 critère validé"},{l:"I",text:"0 critère validé"}
      ]},
      rouladeArriere: { legend:[
        {l:"TB",text:"3 critères validés : Dans l'axe, Se relève équilibré sans poser les genoux au sol, Pieds et jambes serrés pendant toute la roulade"},
        {l:"S",text:"2 critères validés"},{l:"F",text:"1 critère validé"},{l:"I",text:"0 critère validé"}
      ]},
      trepied: { legend:[
        {l:"TB",text:"Aligné et gainé, montée et descente contrôlées"},
        {l:"S",text:"Trépied au mur sans aide"},
        {l:"F",text:"Trépied au mur avec aide"},
        {l:"I",text:"Pas de renversement"}
      ]},
      atr: { legend:[
        {l:"TB",text:"Départ et retour en fente, aligné et gainé"},
        {l:"S",text:"ATR au mur sans aide"},
        {l:"F",text:"ATR au mur avec aide"},
        {l:"I",text:"Pas de renversement"}
      ]}
    }
  },
  "3eme": {
    label: "3ème",
    seanceDefaults: {
      4: {
        nbFigures: { tiers: defaultTiers(2,1,1,0) },
        liaisons: { criteres:["Liaisons","Pas de gestes parasites","Concentration"], tiers: defaultTiers(3,2,1,0) }
      },
      5: {
        nbFigures: { tiers: defaultTiers(4,3,1,0) },
        liaisons: { criteres:["Liaisons","Pas de gestes parasites","Concentration"], tiers: defaultTiers(3,2,1,0) },
        projetCollectif: { criteres:["Coordination","Entrée et fin immobile ORIGINALE","Enchaînement continu"], tiers: defaultTiers(3,2,1,0) }
      },
      6: {
        nbFigures: { tiers: defaultTiers(6,4,2,0) },
        liaisons: { criteres:["Liaisons DYNAMIQUES","Pas de gestes parasites","Concentration"], tiers: defaultTiers(3,2,1,0) },
        projetCollectif: { criteres:["Coordination","Entrée et fin immobile ORIGINALE","Enchaînement continu"], tiers: defaultTiers(3,2,1,0) }
      }
    },
    gym: {
      rouladeAvant: { legend:[
        {l:"TB",text:"3 critères validés : Dans l'axe, Se relève équilibré sans les mains, Pieds et jambes serrés pendant toute la roulade"},
        {l:"S",text:"2 critères validés"},{l:"F",text:"1 critère validé"},{l:"I",text:"0 critère validé"}
      ]},
      rouladeArriere: { legend:[
        {l:"TB",text:"3 critères validés : Dans l'axe, Se relève équilibré sans poser les genoux au sol, Pieds et jambes serrés pendant toute la roulade"},
        {l:"S",text:"2 critères validés"},{l:"F",text:"1 critère validé"},{l:"I",text:"0 critère validé"}
      ]},
      trepied: { legend:[
        {l:"TB",text:"Aligné et gainé, montée et descente contrôlées"},
        {l:"S",text:"Trépied passager"},
        {l:"F",text:"Trépied au mur sans aide"},
        {l:"I",text:"Pas de renversement"}
      ]},
      atr: { legend:[
        {l:"TB",text:"Départ et retour en fente, aligné et gainé"},
        {l:"S",text:"ATR avec pareur qui retient les jambes"},
        {l:"F",text:"ATR au mur sans aide"},
        {l:"I",text:"Pas de renversement"}
      ]}
    }
  }
};

const SHEET_URL_DEFAULT = "https://docs.google.com/spreadsheets/d/1bQy3r9rG96hfvezFIEFodEATNGVefb2_Gl6ihe1Pcns/edit?gid=0#gid=0";

/* =========================================================================
   STATE
   ========================================================================= */
const STORAGE_KEY = "acrosportState_v1";

function freshState(){
  return {
    niveauActif: "4eme",
    sheetUrl: SHEET_URL_DEFAULT,
    importCache: null,
    niveaux: {
      "4eme": { classeActive:null, classes:{}, figuresBank:[], grilleEvalImg:null, figuresTableImg:null, classColors:{} },
      "3eme": { classeActive:null, classes:{}, figuresBank:[], grilleEvalImg:null, figuresTableImg:null, classColors:{} }
    },
    ui: { collapsed:{}, activeSubTab:{} }
  };
}

let STATE = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return freshState();
    const parsed = JSON.parse(raw);
    if(!parsed.niveaux) return freshState();
    return parsed;
  }catch(e){ return freshState(); }
}

let saveTimer=null;
function save(){
  try{
    STATE.lastModified = Date.now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    const el = document.getElementById("saveIndicator");
    if(el){
      const t = new Date();
      el.textContent = "💾 Enregistré " + t.getHours().toString().padStart(2,"0")+":"+t.getMinutes().toString().padStart(2,"0");
    }
    scheduleSyncPush();
  }catch(e){
    console.error("Erreur de sauvegarde", e);
    const el = document.getElementById("saveIndicator");
    if(el) el.textContent = "⚠️ Sauvegarde impossible (espace plein)";
    alert("⚠️ Impossible d'enregistrer : l'espace de stockage du navigateur est plein (probablement à cause des images importées).\n\nPensez à exporter vos données puis à supprimer quelques figures ou images volumineuses.");
  }
}

// Sauvegarde locale pour les préférences d'affichage uniquement (onglet actif, panneaux repliés) :
// ne touche pas lastModified ni la synchronisation, pour que naviguer dans l'app sur un appareil
// ne masque pas des données plus récentes venant d'un autre appareil lors du prochain pull.
function saveUIOnly(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
}

function uid(prefix){ return (prefix||"id")+"_"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }

/* =========================================================================
   SYNCHRONISATION MULTI-APPAREILS (via Google Apps Script)
   ========================================================================= */
const SYNC_URL_KEY = "acrosportSyncUrl";
const SYNC_URL_DEFAULT = "https://script.google.com/macros/s/AKfycbzMUHYXK-Sqp-AmoENs1Q6ArnytEurJQM5Y4pGarexspph1eDkFbZdI8aSjlQcG4_Mv/exec";
function getSyncUrl(){
  try{
    const stored = localStorage.getItem(SYNC_URL_KEY);
    return (stored!==null && stored!=="") ? stored : SYNC_URL_DEFAULT;
  }catch(e){ return SYNC_URL_DEFAULT; }
}
App.getSyncUrl = getSyncUrl;

function nowHHMM(){
  const t = new Date();
  return t.getHours().toString().padStart(2,"0")+":"+t.getMinutes().toString().padStart(2,"0");
}

App.updateSyncStatus = function(msg){
  const el = document.getElementById("syncStatusLine");
  if(el) el.textContent = msg;
  const top = document.getElementById("syncIndicator");
  if(top) top.textContent = msg;
};

App.setSyncUrl = function(val){
  const url = normalize(val);
  try{ localStorage.setItem(SYNC_URL_KEY, url); }catch(e){}
  if(url){ App.syncPull(true); }
  else { App.updateSyncStatus("Synchronisation désactivée."); }
};

let syncPushTimer = null;
function scheduleSyncPush(){
  if(!getSyncUrl()) return;
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(()=>{ App.syncPush(false); }, 2500);
}

App.syncPush = function(manual){
  const url = getSyncUrl();
  if(!url){ if(manual) alert("Configurez d'abord l'URL de synchronisation dans Exigences > Paramètres."); return; }
  if(manual) App.updateSyncStatus("🔄 Envoi en cours...");
  fetch(url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(STATE)
  }).then(r=>r.json()).then(()=>{
    App.updateSyncStatus("☁️ Envoyé à "+nowHHMM());
  }).catch(()=>{
    App.updateSyncStatus("⚠️ Échec de l'envoi (connexion ou URL invalide)");
  });
};

function countClasses(st){
  if(!st || !st.niveaux) return 0;
  let n = 0;
  Object.values(st.niveaux).forEach(niv=>{ n += Object.keys((niv&&niv.classes)||{}).length; });
  return n;
}

App.syncPull = function(manual){
  const url = getSyncUrl();
  if(!url){ if(manual) alert("Configurez d'abord l'URL de synchronisation."); return; }
  App.updateSyncStatus("🔄 Synchronisation en cours...");
  fetch(url, { method:"GET", cache:"no-store" })
    .then(r=>r.json())
    .then(remote=>{
      if(!remote || !remote.niveaux){ App.updateSyncStatus("☁️ Aucune donnée distante pour l'instant — envoi de vos données locales."); App.syncPush(false); return; }
      const remoteTime = remote.lastModified || 0;
      const localTime = STATE.lastModified || 0;
      if(remoteTime > localTime){
        const localCount = countClasses(STATE), remoteCount = countClasses(remote);
        if(remoteCount < localCount){
          App.updateSyncStatus("⚠️ Le cloud contient moins de classes ("+remoteCount+") que vos données locales ("+localCount+") — rien n'a été remplacé.");
          const proceed = confirm("⚠️ Les données reçues du cloud contiennent moins de classes ("+remoteCount+") que vos données locales ("+localCount+").\n\nRemplacer quand même vos données locales par celles du cloud ?\n\nConseil : cliquez sur Annuler, puis sur « ☁️⬆️ Envoyer maintenant » pour plutôt écraser le cloud avec vos données locales (plus complètes).");
          if(!proceed) return;
        }
        STATE = remote;
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
        render();
        App.updateSyncStatus("☁️ Données récupérées à "+nowHHMM());
      } else {
        App.updateSyncStatus("☁️ Déjà à jour ("+nowHHMM()+").");
        App.syncPush(false);
      }
    })
    .catch(()=>{ App.updateSyncStatus("⚠️ Synchronisation impossible (connexion ou URL invalide)"); });
};

// Récupère les données du cloud et les applique SANS regarder quel appareil est "plus récent"
// (utile si l'horloge/lastModified d'un appareil est faussée et bloque une vraie mise à jour).
App.syncForcePull = function(){
  const url = getSyncUrl();
  if(!url){ alert("Configurez d'abord l'URL de synchronisation."); return; }
  App.updateSyncStatus("🔄 Récupération forcée en cours...");
  fetch(url, { method:"GET", cache:"no-store" })
    .then(r=>r.json())
    .then(remote=>{
      if(!remote || !remote.niveaux){ App.updateSyncStatus("⚠️ Aucune donnée distante à récupérer."); return; }
      const localCount = countClasses(STATE), remoteCount = countClasses(remote);
      if(!confirm("Remplacer TOUTES les données de cet appareil par celles du cloud ?\n\nCloud : "+remoteCount+" classe(s)\nCet appareil : "+localCount+" classe(s)\n\nCette action est irréversible sur cet appareil.")) return;
      STATE = remote;
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
      render();
      App.updateSyncStatus("☁️ Données forcées depuis le cloud à "+nowHHMM());
    })
    .catch(()=>{ App.updateSyncStatus("⚠️ Synchronisation impossible (connexion ou URL invalide)"); });
};

/* ---- generic helpers ---- */
function niveau(){ return STATE.niveaux[STATE.niveauActif]; }
function classe(classeId){ return niveau().classes[classeId]; }
function activeClasse(){ const n=niveau(); return n.classeActive ? n.classes[n.classeActive] : null; }

function normalize(s){ return (s||"").toString().trim(); }
function stripAccents(s){ return normalize(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
function sexeIcon(sexe){
  const sNorm = stripAccents(sexe);
  if(sNorm.startsWith("f")) return "♀";
  if(sNorm.startsWith("m") || sNorm.startsWith("g")) return "♂";
  return sexe ? sexe : "—";
}
function sexeIconHtml(sexe){
  const icon = sexeIcon(sexe);
  const color = icon==="♀" ? "#e0329e" : icon==="♂" ? "#1e88e5" : "var(--muted)";
  return `<span style="color:${color};font-weight:800;">${icon}</span>`;
}

const NIVEAU_DIGIT = { "4eme":"4", "3eme":"3" };
function classeAppartientNiveau(nomClasse, niveauKey){
  const digit = NIVEAU_DIGIT[niveauKey];
  if(!digit) return true;
  const s = stripAccents(nomClasse).replace(/^[°\s]+/,"");
  return s.startsWith(digit);
}

function sortStudents(list){
  return [...list].sort((a,b)=>{
    const an = stripAccents(a.nom||a.nomPrenom), bn = stripAccents(b.nom||b.nomPrenom);
    if(an!==bn) return an<bn?-1:1;
    const ap = stripAccents(a.prenom), bp = stripAccents(b.prenom);
    return ap<bp?-1:(ap>bp?1:0);
  });
}

function tierColorClass(l){ return l? "badge-"+l : "badge-none"; }
function badgeHtml(l,extra){
  if(!l) return '<span class="badge badge-none">—</span>';
  return '<span class="badge '+tierColorClass(l)+'">'+l+(extra?(" "+extra):"")+'</span>';
}

function computeTierFromCount(tiers,count){
  const sorted = [...tiers].sort((a,b)=>b.min-a.min);
  for(const t of sorted){ if(count>=t.min) return t.l; }
  return sorted[sorted.length-1].l;
}

const CLASS_PALETTE = [
  {bg:"#5b4ddb", border:"#4336b8"}, // violet (défaut)
  {bg:"#0e9f8f", border:"#0b7d71"}, // teal
  {bg:"#e0603c", border:"#bf4a29"}, // orange brûlé
  {bg:"#2563eb", border:"#1d4ed8"}, // bleu
  {bg:"#c2328f", border:"#9c2372"}, // magenta
  {bg:"#7c3aed", border:"#6425c4"}, // violet clair
  {bg:"#0891b2", border:"#0e7490"}, // cyan
  {bg:"#b45309", border:"#92400e"}, // ambre foncé
  {bg:"#4f46e5", border:"#4338ca"}, // indigo
  {bg:"#db2777", border:"#be185d"}  // rose
];
function classColor(classIds,cid){
  const n = niveau();
  n.classColors = n.classColors || {};
  const override = n.classColors[cid];
  if(override) return { bg: override, border: override };
  const idx = classIds.indexOf(cid);
  return idx>=0 ? CLASS_PALETTE[idx % CLASS_PALETTE.length] : null;
}

App.setClassColor = function(cid, hex){
  const n = niveau();
  n.classColors = n.classColors || {};
  n.classColors[cid] = hex;
  save(); render();
};

function render(){
  renderLevelTabs();
  const app = document.getElementById("app");
  const n = niveau();
  const classIds = Object.keys(n.classes);

  let tabsHtml = `<div class="classTabsBar">`;
  for(const cid of classIds){
    const c = n.classes[cid];
    const active = n.classeActive===cid ? "active":"";
    const col = classColor(classIds,cid);
    tabsHtml += `<div class="classTab ${active}" style="--class-bg:${col.bg};--class-border:${col.border};" onclick="App.setClasse('${cid}')">${c.nom} <span style="opacity:.6;font-weight:500;">(${c.eleves.length})</span>
      <input type="color" value="${col.bg}" onclick="event.stopPropagation()" onchange="event.stopPropagation();App.setClassColor('${cid}',this.value)" title="Changer la couleur de cette classe" style="width:14px;height:14px;padding:0;border:none;border-radius:50%;vertical-align:middle;margin-left:5px;cursor:pointer;background:none;"></div>`;
  }
  tabsHtml += `<button class="btn small primary" onclick="App.openImportModal()">+ Importer élèves / classe</button>`;
  tabsHtml += `<div class="spacer"></div>`;
  const exigActive = n.classeActive==="__exigences__" ? "active":"";
  tabsHtml += `<div class="classTab exigences ${exigActive}" onclick="App.setClasse('__exigences__')">⭐ Exigences ${LEVEL_DEFAULTS[STATE.niveauActif].label}</div>`;
  tabsHtml += `</div>`;

  let body = "";
  if(n.classeActive==="__exigences__"){
    body = renderExigences();
  } else if(n.classeActive && n.classes[n.classeActive]){
    const col = classColor(classIds,n.classeActive);
    body = `<div style="--class-bg:${col.bg};--class-border:${col.border};">${renderClasse(n.classes[n.classeActive])}</div>`;
  } else {
    body = `<div class="acc open"><div class="acc-body"><div class="emptyState">Aucune classe sélectionnée.<br>Cliquez sur « + Importer élèves / classe » pour commencer.</div></div></div>`;
  }

  app.innerHTML = tabsHtml + body;

  if(n.classeActive==="__exigences__"){
    if(cropState && cropState.niveauKey===STATE.niveauActif){ renderCropZone(); }
    else if(n.figuresTableImg){ startCrop(n.figuresTableImg); }
    else { cropState = null; }
  }
}

};

App.getSheetUrl = function(){ return STATE.sheetUrl || SHEET_URL_DEFAULT; };

function extractSheetIdAndGid(url){
  const idMatch = (url||"").match(/\/d\/([a-zA-Z0-9-_]+)/);
  const gidMatch = (url||"").match(/[?#&]gid=(\d+)/);
  return { id: idMatch ? idMatch[1] : null, gid: gidMatch ? gidMatch[1] : "0" };
}

let gvizCounter = 0;
function loadGoogleSheetViaGviz(sheetUrl){
  return new Promise((resolve,reject)=>{
    const { id, gid } = extractSheetIdAndGid(sheetUrl);
    if(!id){ reject(new Error("Lien Google Sheet invalide (identifiant introuvable).")); return; }
    const cbName = "gvizCb_"+(gvizCounter++)+"_"+Date.now();
    const script = document.createElement("script");
    const timer = setTimeout(()=>{ cleanup(); reject(new Error("Délai dépassé. Vérifiez votre connexion internet, et que le Google Sheet est partagé en lecture (« Toute personne disposant du lien peut consulter »).")); }, 12000);
    function cleanup(){
      clearTimeout(timer);
      try{ delete window[cbName]; }catch(e){ window[cbName]=undefined; }
      if(script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function(json){
      cleanup();
      try{
        const table = json.table;
        const headers = table.cols.map(c=>c.label||"");
        const rows = table.rows.map(r=>(r.c||[]).map(cell=>cell ? (cell.f!==undefined && cell.f!==null ? cell.f : (cell.v!==undefined && cell.v!==null ? cell.v : "")) : ""));
        resolve({headers, rows});
      }catch(err){ reject(new Error("Réponse inattendue du Google Sheet.")); }
    };
    script.onerror = function(){ cleanup(); reject(new Error("Impossible de contacter Google Sheets (hors connexion, lien invalide, ou feuille non partagée en lecture).")); };
    script.src = "https://docs.google.com/spreadsheets/d/"+id+"/gviz/tq?tqx=out:json;responseHandler:"+cbName+"&gid="+gid;
    document.body.appendChild(script);
  });
}

function gvizTableToTSV(headers, rows){
  const esc = v => String(v==null?"":v).replace(/\t/g," ").replace(/\r?\n/g," ");
  const lines = [headers.map(esc).join("\t")];
  for(const r of rows) lines.push(r.map(esc).join("\t"));
  return lines.join("\n");
}

App.chargerDepuisGoogleSheet = async function(){
  const zone = document.getElementById("autoLoadZone");
  try{
    const { headers, rows } = await loadGoogleSheetViaGviz(App.getSheetUrl());
    const tsv = gvizTableToTSV(headers, rows);
    parseImportText(tsv);
    if(zone) zone.innerHTML = `<div class="hint" style="border-color:#b7e2ba;background:var(--s-bg);color:var(--s);">✅ Données chargées automatiquement depuis le Google Sheet.</div>`;
  }catch(err){
    if(zone){
      zone.innerHTML = `<div class="hint" style="border-color:#f8c9c6;background:var(--i-bg);color:var(--i);">⚠️ ${err.message}</div>
        <div class="row" style="margin-top:10px;">
          <button class="btn small" onclick="App.chargerDepuisGoogleSheet()">↻ Réessayer</button>
          <button class="btn small" onclick="App.openImportModal('paste')">📋 Coller manuellement à la place</button>
          <button class="btn small" onclick="App.openImportModal('csv')">📁 Importer un fichier CSV</button>
        </div>`;
    }
  }
};

function splitLine(line){
  if(line.indexOf("\t")>=0) return line.split("\t");
  return line.split(",");
}

function parseImportText(txt){
  const lines = txt.split(/\r\n|\n|\r/).map(l=>l).filter(l=>normalize(l).length>0);
  if(lines.length===0){ alert("Aucune donnée détectée."); return; }
  const header = splitLine(lines[0]).map(h=>stripAccents(h));
  let idxNom=-1, idxPrenom=-1, idxClasse=-1, idxSexe=-1, idxNomPrenom=-1;
  header.forEach((h,i)=>{
    if(/^nom$/.test(h)) idxNom=i;
    else if(/^prenom$/.test(h)) idxPrenom=i;
    else if(/nom.*prenom|prenom.*nom/.test(h)) idxNomPrenom=i;
    else if(/^classe$/.test(h)) idxClasse=i;
    else if(/^sexe|^genre/.test(h)) idxSexe=i;
  });
  let dataLines = lines;
  let hasHeader = (idxNom>=0||idxPrenom>=0||idxClasse>=0||idxSexe>=0||idxNomPrenom>=0);
  if(hasHeader) dataLines = lines.slice(1);
  else { idxNom=0; idxPrenom=1; idxClasse=2; idxSexe=3; }

  const rows=[];
  const classesSet = new Set();
  for(const line of dataLines){
    const cols = splitLine(line).map(c=>normalize(c));
    if(cols.every(c=>c==="")) continue;
    let nom="", prenom="";
    if(idxNomPrenom>=0){
      const full = cols[idxNomPrenom]||"";
      const parts = full.split(" ");
      nom = parts[0]||full; prenom = parts.slice(1).join(" ");
    } else {
      nom = idxNom>=0 ? (cols[idxNom]||"") : "";
      prenom = idxPrenom>=0 ? (cols[idxPrenom]||"") : "";
    }
    const cl = idxClasse>=0 ? (cols[idxClasse]||"") : "";
    const sexe = idxSexe>=0 ? (cols[idxSexe]||"") : "";
    if(!nom && !prenom) continue;
    if(cl) classesSet.add(cl);
    rows.push({nom,prenom,nomPrenom:(nom+" "+prenom).trim(),classe:cl,sexe});
  }
  if(rows.length===0){ alert("Impossible de détecter des lignes élèves. Vérifiez le format (colonnes Nom / Prénom / Classe / Sexe)."); return; }
  importPreview = { rows, classes: [...classesSet].sort() };
  STATE.importCache = { rows, classes: importPreview.classes, updatedAt: new Date().toLocaleString("fr-FR") };
  save();
  renderImportPreview();
}

function renderImportPreview(){
  const zone = document.getElementById("importPreviewZone");
  if(!importPreview){ zone.innerHTML=""; return; }
  const { rows, classes } = importPreview;
  const dejaImportees = new Set(Object.values(niveau().classes).map(c=>c.nom));
  const classesNiveau = classes.filter(c=>classeAppartientNiveau(c,STATE.niveauActif));
  const classesAutres = classes.filter(c=>!classeAppartientNiveau(c,STATE.niveauActif));
  let html = `<div style="margin-top:14px;">
    <h4 style="font-size:13px;margin-bottom:6px;">${rows.length} élève(s) détecté(s) — cochez la/les classe(s) de ${LEVEL_DEFAULTS[STATE.niveauActif].label} à importer :</h4>`;
  if(classes.length===0){
    html += `<div class="hint">Aucune colonne « Classe » détectée : tous les élèves seront importés dans une classe nommée ci-dessous.</div>
      <div class="field" style="margin:10px 0;"><label>Nom de la classe</label><input type="text" id="manualClasseName" value="Classe 1" style="width:160px;"></div>`;
  } else {
    html += `<div class="row" style="margin-bottom:6px;">
      <button class="btn small" onclick="App.toggleAllImportClasses(true)">Tout sélectionner</button>
      <button class="btn small" onclick="App.toggleAllImportClasses(false)">Tout désélectionner</button>
    </div>
    <div class="row" style="margin-bottom:10px;">`;
    const classesAffichees = classesNiveau.length>0 ? classesNiveau : classes;
    for(const c of classesAffichees){
      const count = rows.filter(r=>r.classe===c).length;
      const already = dejaImportees.has(c);
      html += `<label style="display:flex;align-items:center;gap:5px;background:${already?'#eef7ef':'#f3f4fa'};border:1px solid ${already?'#b7e2ba':'var(--border)'};border-radius:8px;padding:5px 10px;">
        <input type="checkbox" class="importClasseChk" value="${c}" ${already?'':'checked'}> <b>${c}</b> <span style="color:var(--muted);">(${count})</span>${already?' <span class="pill" style="background:var(--s-bg);color:var(--s);" title="Si coché : ajoute les nouveaux élèves et retire ceux absents de cette liste (sans toucher aux notes déjà saisies)">déjà importée — cocher pour mettre à jour</span>':''}</label>`;
    }
    if(classesNiveau.length>0 && classesAutres.length>0){
      html += `</div><div class="hint" style="margin-bottom:10px;">${classesAutres.length} autre(s) classe(s) détectée(s) ne semblent pas être du niveau ${LEVEL_DEFAULTS[STATE.niveauActif].label} (${classesAutres.join(", ")}) et sont masquées.
        <a href="#" onclick="App.toggleShowOtherNiveaux();return false;">${importShowOthers?'Masquer':'Afficher quand même'}</a></div>`;
      if(importShowOthers){
        html += `<div class="row" style="margin-bottom:10px;">`;
        for(const c of classesAutres){
          const count = rows.filter(r=>r.classe===c).length;
          const already = dejaImportees.has(c);
          html += `<label style="display:flex;align-items:center;gap:5px;background:#f3f4fa;border:1px dashed var(--border);border-radius:8px;padding:5px 10px;">
            <input type="checkbox" class="importClasseChk" value="${c}"> ${c} <span style="color:var(--muted);">(${count})</span></label>`;
        }
        html += `</div>`;
      }
    } else {
      html += `</div>`;
    }
  }
  html += `
    <div class="table-wrap" style="max-height:220px;margin-bottom:10px;">
      <table><thead><tr><th>Nom Prénom</th><th>Classe</th><th>Sexe</th></tr></thead><tbody>
      ${rows.slice(0,200).map(r=>`<tr><td>${r.nomPrenom}</td><td>${r.classe||"—"}</td><td>${r.sexe||"—"}</td></tr>`).join("")}
      </tbody></table>
    </div>
    <button class="btn primary" onclick="App.confirmImport()">✅ Importer la sélection</button>
  </div>`;
  zone.innerHTML = html;
}

App.confirmImport = function(){
  if(!importPreview) return;
  const n = niveau();
  let selectedClasses;
  if(importPreview.classes.length===0){
    const name = normalize(document.getElementById("manualClasseName").value) || "Classe 1";
    selectedClasses = [name];
    importPreview.rows.forEach(r=>r.classe = name);
  } else {
    selectedClasses = [...document.querySelectorAll(".importClasseChk:checked")].map(c=>c.value);
  }
  if(selectedClasses.length===0){ alert("Sélectionnez au moins une classe."); return; }

  // Prépare les ajouts/retraits sans encore rien modifier, pour pouvoir résumer et confirmer les retraits.
  const plan = []; // {clName, clId, isNew, target, toAdd:[...], toRemove:[...]}
  for(const clName of selectedClasses){
    const clId = Object.keys(n.classes).find(id=>n.classes[id].nom===clName);
    const isNew = !clId;
    const target = isNew ? newClasseObj(clName) : n.classes[clId];
    const studentsForClass = importPreview.rows.filter(r=>r.classe===clName);
    const importNames = studentsForClass.map(s=>stripAccents(s.nomPrenom));
    const toAdd = studentsForClass.filter(s=>!target.eleves.some(e=>stripAccents(e.nomPrenom)===stripAccents(s.nomPrenom)));
    const toRemove = isNew ? [] : target.eleves.filter(e=>!importNames.includes(stripAccents(e.nomPrenom)));
    plan.push({ clName, clId: clId||uid("cl"), isNew, target, toAdd, toRemove });
  }

  const removals = plan.filter(p=>p.toRemove.length>0);
  if(removals.length>0){
    const msg = "⚠️ Ces élèves ne figurent plus dans les données importées et seront retirés de leur classe (leurs éventuelles notes déjà saisies resteront inchangées pour les autres élèves) :\n\n"
      + removals.map(p=>`${p.clName} : ${p.toRemove.map(e=>e.nomPrenom).join(", ")}`).join("\n")
      + "\n\nContinuer ?";
    if(!confirm(msg)) return;
  }

  let firstNewId = null;
  for(const p of plan){
    if(p.isNew) n.classes[p.clId] = p.target;
    if(!firstNewId) firstNewId = p.clId;
    for(const s of p.toAdd){
      p.target.eleves.push({ id: uid("el"), nom:s.nom, prenom:s.prenom, nomPrenom:s.nomPrenom, sexe:s.sexe||"" });
    }
    if(p.toRemove.length>0){
      const removeIds = new Set(p.toRemove.map(e=>e.id));
      p.target.eleves = p.target.eleves.filter(e=>!removeIds.has(e.id));
    }
  }
  n.classeActive = firstNewId;
  importPreview = null;
  App.closeModal();
  save();
  render();
};

function newClasseObj(nom){
  return {
    nom,
    eleves: [],
    seances: [],
    gym: initGymResults(),
    evalFinale: initEvalFinale()
  };
}
function initGymResults(){
  return {
    rouladeAvant:{ resultats:{} },
    rouladeArriere:{ resultats:{} },
    trepied:{ resultats:{} },
    atr:{ resultats:{} }
  };
}
function initEvalFinale(){
  return {
    id: "evalfinale",
    numero: 999,
    groupes: [],
    figuresParGroupe: {},
    validations: {},
    tierManuel: {},
    porteurVoltigeur: {},
    tenue: {},
    liaisons: {},
    projetCollectif: {},
    implicationManuel: {},
    attitudeManuel: {},
    echauffement: {}
  };
}
function ensureEvalFinale(c){
  c.evalFinale = c.evalFinale || initEvalFinale();
  c.evalFinale.id = c.evalFinale.id || "evalfinale";
  c.evalFinale.numero = c.evalFinale.numero || 999;
  c.evalFinale.groupes = c.evalFinale.groupes || [];
  c.evalFinale.figuresParGroupe = c.evalFinale.figuresParGroupe || {};
  c.evalFinale.validations = c.evalFinale.validations || {};
  c.evalFinale.tierManuel = c.evalFinale.tierManuel || {};
  return c.evalFinale;
}
function ensureEvalFinaleGroupes(c){
  const ef = ensureEvalFinale(c);
  if(ef.groupes.length===0 && c.seances.length>0){
    const lastSeance = c.seances.reduce((max,s)=>s.numero>max.numero?s:max);
    const presents = c.eleves.map(e=>e.id);
    const pairs = lastSeance.groupes.map(g=>({oldId:g.id, newGroup:{id:uid("gr"), membres:g.membres.filter(id=>presents.includes(id))}}))
      .filter(p=>p.newGroup.membres.length>0);
    ef.groupes = pairs.map(p=>p.newGroup);
    pairs.forEach(p=>{
      const figs = lastSeance.figuresParGroupe && lastSeance.figuresParGroupe[p.oldId];
      if(figs) ef.figuresParGroupe[p.newGroup.id] = cloneDeep(figs);
      const vals = lastSeance.validations && lastSeance.validations[p.oldId];
      if(vals) ef.validations[p.newGroup.id] = cloneDeep(vals);
    });
    if(lastSeance.evalConfig) ef.evalConfig = cloneDeep(lastSeance.evalConfig);
  }
  if(!ef.evalConfig) ef.evalConfig = { nbFigures:{ tiers: defaultTiers(4,2,1,0) } };
  return ef;
}
function efFigColumnsForStudent(c,eid){
  const ef = ensureEvalFinale(c);
  const g = ef.groupes.find(gr=>gr.membres.includes(eid));
  if(!g) return null;
  const bank = niveau().figuresBank;
  const groupFigIds = ef.figuresParGroupe[g.id] || [];
  const figColumns = groupFigIds.map(id=>bank.find(f=>f.id===id)).filter(Boolean);
  const isDuoFig = f => g.membres.length>2 && /^d/i.test(f.nom);
  let idx = 0;
  if(g.membres.length>2){
    const u = pairUpMembers(g.membres).find(u=>u.membres.includes(eid));
    idx = u ? u.idx : 0;
  }
  return {g, figColumns, isDuoFig, idx};
}

function renderClasse(c){
  const cid = Object.keys(niveau().classes).find(id=>niveau().classes[id]===c);
  const tabKey = "classSection_"+cid;
  const active = getActiveSubTab(tabKey,"eleves");

  const sections = [
    {key:"eleves", label:"👥 Élèves", count:c.eleves.length},
    {key:"seances", label:"📅 Séances", count:c.seances.length},
    {key:"gym", label:"🤸 Éléments gymniques"},
    {key:"evalFinale", label:"🏁 Évaluation finale"},
    {key:"recap", label:"📊 Récap classe"}
  ];

  let html = `<div class="subTabBar">`;
  for(const sec of sections){
    html += `<button class="subTab ${active===sec.key?'active':''}" onclick="App.setActiveSubTab('${tabKey}','${sec.key}')">${sec.label}${sec.count!==undefined?` <span style="opacity:.75;">(${sec.count})</span>`:``}</button>`;
  }
  html += `</div>`;

  else if(active==="gym") html += renderGymPanel(cid,c);

  else if(active==="recap") html += renderRecapPanel(cid,c);

  html += `</div></div>`;

  return html;
}

/* =========================================================================
   SEANCES
   ========================================================================= */
function nextSeanceNumero(c){
  return c.seances.length>0 ? Math.max(...c.seances.map(s=>s.numero))+1 : 1;
}

App.creerSeance = function(cid){
  const c = classe(cid);
  const numero = nextSeanceNumero(c);
  const lvl = LEVEL_DEFAULTS[STATE.niveauActif];
  const seance = {
    id: uid("se"),
    numero,
    date: new Date().toISOString().slice(0,10),
    absents: [],
    dispenses: [],
    groupes: [],
    figuresAssignees: [],
    figuresParGroupe: {},
    implication: {},
    attitude: {},
    validations: {},
    spectateur: {},
    spectateurStart: {},
    gymCriteriaUsed: false
  };

  // note spectateur : reportée depuis la séance précédente (20 par défaut en séance 1)
  {
    const prevSp = c.seances.length>0 ? c.seances.reduce((max,s)=>s.numero>max.numero?s:max) : null;
    c.eleves.forEach(e=>{
      const start = prevSp && prevSp.spectateur && prevSp.spectateur[e.id]!==undefined ? prevSp.spectateur[e.id] : 20;
      seance.spectateur[e.id] = start;
      seance.spectateurStart[e.id] = start;
    });
  }

  // config d'évaluation par défaut selon le niveau et le numéro de séance
  if(numero>=4){
    const defs = lvl.seanceDefaults;
    const key = defs[numero] ? numero : Math.max(...Object.keys(defs).map(Number));
    seance.evalConfig = cloneDeep(defs[key]);
  }

  // groupes par défaut : reconduits depuis la séance précédente pour les binômes (séances 2 et 3,
  // reprise de la séance immédiatement avant) et à partir de la séance 5 (modifiable),
  // sinon construits manuellement par clic (séances 1 et 4)
  if(numero>=2 && numero<=3){
    const presents = c.eleves.map(e=>e.id);
    const prev = c.seances.find(s=>s.numero===numero-1);
    if(prev){
      seance.groupes = cloneDeep(prev.groupes).map(g=>({id:uid("gr"), membres:g.membres.filter(id=>presents.includes(id))})).filter(g=>g.membres.length>0);
    }
  } else if(numero>=5){
    const presents = c.eleves.map(e=>e.id);
    const prev = [...c.seances].reverse().find(s=>s.numero<numero);
    if(prev){
      const pairs = prev.groupes.map(g=>({oldId:g.id, newGroup:{id:uid("gr"), membres:g.membres.filter(id=>presents.includes(id))}}))
        .filter(p=>p.newGroup.membres.length>0);
      seance.groupes = pairs.map(p=>p.newGroup);
      pairs.forEach(p=>{
        const figs = prev.figuresParGroupe && prev.figuresParGroupe[p.oldId];
        if(figs) seance.figuresParGroupe[p.newGroup.id] = cloneDeep(figs);
      });
    }
  }

  c.seances.push(seance);
  c.seances.sort((a,b)=>a.numero-b.numero);
  save(); render();
};

function findSeance(cid,sid){
  const c = classe(cid);
  if(c.evalFinale && c.evalFinale.id===sid) return c.evalFinale;
  return c.seances.find(s=>s.id===sid);
}

App.toggleAbsent = function(cid,sid,eid,type){
  const s = findSeance(cid,sid);
  const arr = type==="absent" ? s.absents : s.dispenses;
  const idx = arr.indexOf(eid);
  if(idx>=0) arr.splice(idx,1); else arr.push(eid);
  // retire des groupes si absent/dispensé
  if(arr===s.absents || arr===s.dispenses){
    if(s.absents.includes(eid) || s.dispenses.includes(eid)){
      s.groupes.forEach(g=>{ g.membres = g.membres.filter(id=>id!==eid); });
    }
  }
  save(); render();
};

let groupSelection = null; // {sid, eid} - élève sélectionné en attente d'un clic sur un groupe cible

App.clickEleveGroupe = function(cid,sid,eid){
  if(groupSelection && groupSelection.sid===sid && groupSelection.eid===eid){
    groupSelection = null;
    render();
    return;
  }
  const s = findSeance(cid,sid);
  if(s.numero<=3 && groupSelection && groupSelection.sid===sid){
    // séances 1-3 : cliquer 2 élèves forme automatiquement un binôme
    const first = groupSelection.eid;
    groupSelection = null;
    const ng = { id: uid("gr"), membres:[first,eid] };
    s.groupes.forEach(g=>{ g.membres = g.membres.filter(m=>m!==first && m!==eid); });
    s.groupes = s.groupes.filter(g=>g.membres.length>0);
    s.groupes.push(ng);
    save(); render();
    return;
  }
  groupSelection = { sid, eid };
  render();
};

App.deplacerEleve = function(cid,sid,eid,groupeKey){
  const s = findSeance(cid,sid);
  s.groupes.forEach(g=>{ g.membres = g.membres.filter(id=>id!==eid); });
  if(groupeKey==="__new__"){
    s.groupes.push({id:uid("gr"), membres:[eid]});
  } else if(groupeKey!=="__none__"){
    const g = s.groupes.find(g=>g.id===groupeKey);
    if(g) g.membres.push(eid);
  }
  s.groupes = s.groupes.filter(g=>g.membres.length>0);
  save(); render();
};

App.toggleFigureGroupe = function(cid,sid,groupeId,figId){
  const s = findSeance(cid,sid);
  s.figuresParGroupe = s.figuresParGroupe || {};
  const arr = s.figuresParGroupe[groupeId] = s.figuresParGroupe[groupeId] || [];
  const i = arr.indexOf(figId);
  if(i>=0) arr.splice(i,1); else arr.push(figId);
  save(); render();
};

App.deplacerOrdre = function(cid,sid,groupeId,eid,direction){
  const s = findSeance(cid,sid);
  const g = s.groupes.find(x=>x.id===groupeId);
  if(!g) return;
  const idx = g.membres.indexOf(eid);
  const newIdx = idx+direction;
  if(idx<0 || newIdx<0 || newIdx>=g.membres.length) return;
  const tmp = g.membres[idx]; g.membres[idx] = g.membres[newIdx]; g.membres[newIdx] = tmp;
  save(); render();
};

App.handleMemberDragStart = function(ev,eid){
  ev.dataTransfer.setData("text/plain",eid);
};
App.handleMemberDrop = function(ev,cid,sid,groupeId,targetEid){
  ev.preventDefault();
  const draggedEid = ev.dataTransfer.getData("text/plain");
  if(!draggedEid || draggedEid===targetEid) return;
  const s = findSeance(cid,sid);
  const g = s.groupes.find(x=>x.id===groupeId);
  if(!g) return;
  const from = g.membres.indexOf(draggedEid);
  if(from<0) return;
  g.membres.splice(from,1);
  const to = g.membres.indexOf(targetEid);
  if(to<0) return;
  g.membres.splice(to,0,draggedEid);
  save(); render();
};

const FIG_STATE_CYCLE = [null,"done","wave","cross"];
App.toggleValidation = function(cid,sid,groupeId,figId){
  const s = findSeance(cid,sid);
  s.validations[groupeId] = s.validations[groupeId]||{};
  const cur = s.validations[groupeId][figId] || null;
  const next = FIG_STATE_CYCLE[(FIG_STATE_CYCLE.indexOf(cur)+1)%FIG_STATE_CYCLE.length];
  if(next===null) delete s.validations[groupeId][figId]; else s.validations[groupeId][figId] = next;
  save(); render();
};
App.resetValidation = function(cid,sid,groupeId,figId){
  const s = findSeance(cid,sid);
  s.validations[groupeId] = s.validations[groupeId] || {};
  s.validations[groupeId][figId] = "blank";
  save(); render();
};
function figStateMarkup(state,accent){
  accent = accent || "#5b6478";
  if(state==="blank") return "";
  if(state==="done") return `<span class="valcheck done" style="margin:0 auto;">✓</span>`;
  if(state==="wave") return `<span class="valcheck" style="margin:0 auto;background:var(--f);border-color:var(--f);color:#fff;">〜</span>`;
  if(state==="cross") return `<span class="valcheck" style="margin:0 auto;background:var(--i);border-color:var(--i);color:#fff;">✗</span>`;
  return `<span class="valcheck" style="margin:0 auto;background:#fff;border:2.5px solid ${accent};"></span>`;
}

function pairUpMembers(membres){
  const units = [];
  let i=0, idx=0;
  for(i=0; i+1<membres.length; i+=2){
    units.push({idx, membres:[membres[i],membres[i+1]]});
    idx++;
  }
  if(i<membres.length){
    if(units.length>0) units[units.length-1].membres.push(membres[i]);
    else units.push({idx:0, membres:[membres[i]]});
  }
  return units;
}

function isIndivFig(f){ return /^gym/i.test(f.nom); }
function figureValeurAuto(nom){
  const s = (nom||"").trim();
  const numMatch = s.match(/(\d+)\s*$/);
  if(!numMatch) return null;
  const n = parseInt(numMatch[1],10);
  const catMatch = s.match(/^(QUIN|GYM|[DTQ])/i);
  const cat = catMatch ? catMatch[1].toUpperCase() : null;
  if(cat==="D" || cat==="T"){
    if(n>=1 && n<=4) return 1;
    if(n>=5 && n<=8) return 2;
    if(n>=9 && n<=12) return 3;
    return null;
  }
  if(cat==="Q" || cat==="QUIN" || cat==="GYM"){
    if(n>=1 && n<=2) return 1;
    if(n>=3 && n<=4) return 2;
    if(n>=5 && n<=6) return 3;
    return null;
  }
  return null;
}

  }

    const imgH = Math.round(imgW*0.75);

      <th style="font-size:15px;font-weight:800;color:${gBorder};white-space:nowrap;">GROUPE ${gidx+1}</th>
      ${figColumns.map(f=>`<th draggable="true"
          ondragstart="event.dataTransfer.setData('text/plain','${f.id}')"
          ondragover="event.preventDefault()"
          ondrop="App.handleFigDrop(event,'${cid}','${s.id}','${g.id}','${f.id}')"
          style="cursor:grab;" title="Glisser pour réordonner les figures.">
          <img src="${f.img}" style="width:${imgW}px;height:${imgH}px;object-fit:cover;border-radius:6px;display:block;margin:0 auto 3px;pointer-events:none;">${f.nom}${hideDomains&&figureValeurAuto(f.nom)?`<div style="font-weight:400;font-size:9.5px;">${figureValeurAuto(f.nom)} pt${figureValeurAuto(f.nom)>1?'s':''}</div>`:''}
        </th>`).join("")}
      <th>${hideDomains?'Points':'Figures'}</th>
      ${domains.map(d=>`<th style="white-space:normal;min-width:150px;max-width:180px;">${d.label}<br><span style="font-weight:400;font-size:9.5px;color:var(--muted);text-transform:none;letter-spacing:0;display:block;text-align:center;">${(s.evalConfig[d.key].criteres||[]).join("<br>")}</span></th>`).join("")}
    </tr></thead><tbody>`;

    const duoUnits = g.membres.length>2 ? pairUpMembers(g.membres) : [{idx:0, membres:g.membres}];
    const isDuoFig = f => g.membres.length>2 && /^d/i.test(f.nom);

    duoUnits.forEach(u=>{
      const v = s.validations[g.id] || {};

      u.membres.forEach(mid=>{
        const e = c.eleves.find(x=>x.id===mid); if(!e) return;
        let count = 0, points = 0, touched = false;
        const figCells = figColumns.map(f=>{
          const figKey = isIndivFig(f) ? (f.id+"_e"+mid) : isDuoFig(f) ? (f.id+"_d"+u.idx) : f.id;
          const state = v[figKey] || null;
          const val = figureValeurAuto(f.nom) || 0;
          if(state==="done"||state==="wave"||state==="cross") touched = true;
          if(state==="done"){ count += 1; points += val; }
          else if(state==="wave"){ count += 0.5; points += val*0.5; }
          return `<td class="valcell" style="text-align:center;vertical-align:middle;" onclick="App.toggleValidation('${cid}','${s.id}','${g.id}','${figKey}')" ondblclick="event.stopPropagation();App.resetValidation('${cid}','${s.id}','${g.id}','${figKey}')" title="Clic : cercle → ✓ vert → 〜 orange → ✗ rouge → cercle. Double-clic : enlever le cercle (case vide).">${figStateMarkup(state,gBorder)}</td>`;
        }).join("");
        const figTierCell = hideDomains
          ? `<td style="text-align:center;font-weight:800;">${touched?(points%1===0?points:points.toFixed(1)):0}/18</td>`
          : (()=>{
              const figTier = touched ? computeTierFromCount(s.evalConfig.nbFigures.tiers,count) : null;
              return `<td>${badgeHtml(figTier)}<div style="font-size:9.5px;color:var(--muted);">${touched?(count%1===0?count:count.toFixed(1)):'—'}</div></td>`;
            })();

        html += `<tr>`;
        html += `<td class="nameCell" style="white-space:normal;max-width:150px;">${e.nomPrenom}</td>`;
        html += figCells;
        html += figTierCell;
        domains.forEach(d=>{
          const domainKey = d.key==="liaisons" ? mid : g.id;
          const cur = (s.tierManuel && s.tierManuel[d.key] && s.tierManuel[d.key][domainKey]) || null;
          html += `<td class="${cur?'tdTier-'+cur:''}" style="cursor:pointer;" onclick="App.cycleTierManuel('${cid}','${s.id}','${d.key}','${domainKey}')" title="Cliquer pour changer (TB → S → F → I → vide)">${cur||'—'}</td>`;
        });
        html += `</tr>`;
      });
    });
    html += `</tbody></table></div></div>`;
  });
  return html;
}

App.handleFigDrop = function(ev,cid,sid,groupeId,targetFigId){
  ev.preventDefault();
  const figId = ev.dataTransfer.getData("text/plain");
  if(!figId || figId===targetFigId) return;
  const s = findSeance(cid,sid);
  const arr = s.figuresParGroupe && s.figuresParGroupe[groupeId];
  if(!arr) return;
  const from = arr.indexOf(figId), to = arr.indexOf(targetFigId);
  if(from<0 || to<0) return;
  arr.splice(from,1);
  arr.splice(to,0,figId);
  save(); render();
};

function figColumnsForStudent(s,eid){
  const g = s.groupes.find(gr=>gr.membres.includes(eid));
  if(!g) return null;
  const bank = niveau().figuresBank;
  const groupFigIds = (s.figuresParGroupe && s.figuresParGroupe[g.id]) || [];
  const figColumns = groupFigIds.map(id=>bank.find(f=>f.id===id)).filter(Boolean);
  const isDuoFig = f => g.membres.length>2 && /^d/i.test(f.nom);
  let idx = 0;
  if(g.membres.length>2){
    const u = pairUpMembers(g.membres).find(u=>u.membres.includes(eid));
    idx = u ? u.idx : 0;
  }
  const figKey = f => isIndivFig(f) ? (f.id+"_e"+eid) : isDuoFig(f) ? (f.id+"_d"+idx) : f.id;
  return {g, figColumns, isDuoFig, idx, figKey};
}
function countFiguresForStudent(s,eid){
  const ctx = figColumnsForStudent(s,eid);
  if(!ctx) return 0;
  const v = s.validations[ctx.g.id] || {};
  let n = 0;
  ctx.figColumns.forEach(f=>{
    const state = v[ctx.figKey(f)];
    if(state==="done") n += 1;
    else if(state==="wave") n += 0.5;
  });
  return n;
}
function figuresTouchedForStudent(s,eid){
  const ctx = figColumnsForStudent(s,eid);
  if(!ctx) return false;
  const v = s.validations[ctx.g.id] || {};
  return ctx.figColumns.some(f=>{
    const state = v[ctx.figKey(f)];
    return state==="done"||state==="wave"||state==="cross";
  });
}
function seanceGroupTier(s,eid,type){
  if(type==="nbFigures"){
    if(!figuresTouchedForStudent(s,eid)) return null;
    return computeTierFromCount(s.evalConfig.nbFigures.tiers, countFiguresForStudent(s,eid));
  }
  const key = type==="liaisons" ? eid : gradingUnitKeyForStudent(s,eid);
  if(!key) return null;
  return (s.tierManuel && s.tierManuel[type] && s.tierManuel[type][key]) || null;
}

const TIER_SCORE = {TB:18,S:13,F:9,I:4};
function globalTierForStudent(s,eid){
  if(!s.evalConfig) return null;
  const types = ["nbFigures","liaisons"]; if(s.evalConfig.projetCollectif) types.push("projetCollectif");
  const tiers = types.map(t=>seanceGroupTier(s,eid,t)).filter(Boolean);
  if(tiers.length===0) return null;
  const avg = tiers.reduce((a,t)=>a+TIER_SCORE[t],0)/tiers.length;
  if(avg>=16) return "TB"; if(avg>=11) return "S"; if(avg>=6) return "F"; return "I";
}

function autoAverageTier(c,eid,field){
  const scores = [];
  c.seances.forEach(s=>{
    const v = s[field] && s[field][eid];
    if(v) scores.push(TIER_SCORE[v]);
  });
  if(scores.length===0) return null;
  const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
  if(avg>=16) return "TB"; if(avg>=11) return "S"; if(avg>=6) return "F"; return "I";
}

function efPointsForStudent(c,eid){
  const ctx = efFigColumnsForStudent(c,eid);
  if(!ctx) return 0;
  const ef = ensureEvalFinale(c);
  const v = ef.validations[ctx.g.id] || {};
  let total = 0;
  ctx.figColumns.forEach(f=>{
    const k = ctx.isDuoFig(f) ? (f.id+"_d"+ctx.idx) : f.id;
    const state = v[k];
    const val = figureValeurAuto(f.nom) || 0;
    if(state==="done") total += val;
    else if(state==="wave") total += val*0.5;
  });
  return total;
}

App.cycleOuiNon = function(cid,field,eid){
  const c = classe(cid);
  const ef = ensureEvalFinale(c);
  const cur = ef[field][eid] || null;
  const cycle = [null,"oui","non"];
  const next = cycle[(cycle.indexOf(cur)+1)%cycle.length];
  if(next===null) delete ef[field][eid]; else ef[field][eid] = next;
  save(); render();
};
App.cycleEvalFinaleTier = function(cid,field,eid){
  const c = classe(cid);
  const ef = ensureEvalFinale(c);
  const cur = ef[field][eid] || null;
  const idx = TIER_CYCLE.indexOf(cur);
  const next = TIER_CYCLE[(idx+1)%TIER_CYCLE.length];
  if(next===null) delete ef[field][eid]; else ef[field][eid] = next;
  save(); render();
};

function recapSeanceDomains(s){
  if(s.evalConfig){
    const d = [{key:"nbFigures", label:"Figures"}, {key:"liaisons", label:"Liaisons"}];
    if(s.evalConfig.projetCollectif) d.push({key:"projetCollectif", label:"Projet collectif"});
    d.push({key:"implication", label:"Implication"}, {key:"attitude", label:"Attitude"});
    return d;
  }
  return [{key:"figuresValidees", label:"Figures validées"}, {key:"implication", label:"Implication"}, {key:"attitude", label:"Attitude"}];
}

      </tr>

        seances.forEach((s,i)=>{
          const doms = seanceDomains[i];
          if(s.absents.includes(e.id)) row += `<td colspan="${doms.length}" style="${sepStyle(i)}background:${sBg(i)};">Abs.</td>`;

function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function resizeImageDataUrl(dataUrl, maxDim){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = function(){
      let w = img.naturalWidth, h = img.naturalHeight;
      if(Math.max(w,h) > maxDim){
        const scale = maxDim / Math.max(w,h);
        w = Math.round(w*scale); h = Math.round(h*scale);
      }
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      resolve(c.toDataURL("image/jpeg",0.88));
    };
    img.onerror = ()=>resolve(dataUrl);
    img.src = dataUrl;
  });
}

document.getElementById("hiddenFigureInput").addEventListener("change", async function(e){
  const files = Array.from(e.target.files||[]);
  e.target.value = "";
  if(files.length===0) return;
  let added = 0;
  for(const f of files){
    const raw = await readFileAsDataURL(f);
    const dataUrl = await resizeImageDataUrl(raw, 500);
    const defaultName = f.name.replace(/\.[^.]+$/,"");
    const nom = normalize(prompt(`Nom de cette figure (${added+1}/${files.length}) :`, defaultName));
    if(!nom) continue;
    niveau().figuresBank.push({ id: uid("fig"), nom, img: dataUrl });
    added++;
  }
  save(); render();
});

function startCrop(dataUrl){
  const img = new Image();
  img.onload = function(){
    const maxW = Math.min(820, (document.getElementById("cropZone")||{}).clientWidth || 820);
    const scale = Math.min(1, maxW / img.naturalWidth);
    cropState = { img, scale, rect:null, drawing:false, niveauKey: STATE.niveauActif };
    renderCropZone();
  };
  img.src = dataUrl;
}

function renderCropZone(){
  const zone = document.getElementById("cropZone");
  if(!cropState){ zone.innerHTML=""; return; }
  const w = Math.round(cropState.img.naturalWidth*cropState.scale);
  const h = Math.round(cropState.img.naturalHeight*cropState.scale);
  zone.innerHTML = `<div class="cropWrap"><canvas id="cropCanvas" width="${w}" height="${h}"></canvas></div>
    <div class="row" style="margin-top:8px;">
      <button class="btn primary" id="extractBtn" disabled onclick="App.extraireFigure()">✂️ Extraire la sélection</button>
      <button class="btn danger" onclick="App.supprimerImageSource()">🗑️ Supprimer l'image source</button>
    </div>
    <div class="hint" style="margin-top:6px;">Dessinez un cadre avec la souris (clic-glisser) sur la figure à extraire, puis cliquez sur « Extraire ».</div>`;
  const canvas = document.getElementById("cropCanvas");
  const ctx = canvas.getContext("2d");
  function redraw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(cropState.img,0,0,canvas.width,canvas.height);
    if(cropState.rect){
      const r = cropState.rect;
      ctx.strokeStyle = "#5b4ddb"; ctx.lineWidth=2;
      ctx.setLineDash([6,4]);
      ctx.strokeRect(r.x,r.y,r.w,r.h);
      ctx.fillStyle = "rgba(91,77,219,0.12)";
      ctx.fillRect(r.x,r.y,r.w,r.h);
    }
  }
  redraw();
  let startX,startY;
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x:(clientX-rect.left)*(canvas.width/rect.width), y:(clientY-rect.top)*(canvas.height/rect.height) };
  }
  function down(e){ e.preventDefault(); const p=getPos(e); startX=p.x; startY=p.y; cropState.drawing=true; }
  function move(e){
    if(!cropState.drawing) return; e.preventDefault();
    const p = getPos(e);
    cropState.rect = { x:Math.min(startX,p.x), y:Math.min(startY,p.y), w:Math.abs(p.x-startX), h:Math.abs(p.y-startY) };
    redraw();
    document.getElementById("extractBtn").disabled = !(cropState.rect.w>6 && cropState.rect.h>6);
  }
  function up(e){ cropState.drawing=false; }
  canvas.addEventListener("mousedown",down);
  canvas.addEventListener("mousemove",move);
  window.addEventListener("mouseup",up);
  canvas.addEventListener("touchstart",down);
  canvas.addEventListener("touchmove",move);
  canvas.addEventListener("touchend",up);
}

App.extraireFigure = function(){
  if(!cropState || !cropState.rect) return;
  const r = cropState.rect;
  const inv = 1/cropState.scale;
  const sx = r.x*inv, sy = r.y*inv, sw = r.w*inv, sh = r.h*inv;
  const off = document.createElement("canvas");
  off.width = Math.max(1,Math.round(sw)); off.height = Math.max(1,Math.round(sh));
  off.getContext("2d").drawImage(cropState.img, sx, sy, sw, sh, 0, 0, off.width, off.height);
  const dataUrl = off.toDataURL("image/png");
  const nom = normalize(prompt("Nom de cette figure :",""));
  if(!nom){ return; }
  niveau().figuresBank.push({ id: uid("fig"), nom, img: dataUrl });
  cropState.rect = null;
  save();
  render(); // render() ré-affiche automatiquement l'outil de recadrage (cropState est conservé) pour extraire la figure suivante
};

/* =========================================================================
   EXPORT / IMPORT JSON (sauvegarde manuelle multi-appareils)
   ========================================================================= */
App.exportData = function(){
  const blob = new Blob([JSON.stringify(STATE,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date().toISOString().slice(0,10);
  a.href = url; a.download = "acrosport_sauvegarde_"+d+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

App.exportClasseExcel = function(cid){
  if(typeof XLSX === "undefined"){
    alert("⚠️ La bibliothèque d'export Excel n'a pas pu se charger. Vérifiez votre connexion internet puis réessayez.");
    return;
  }
  const c = classe(cid);
  if(!c) return;
  const sorted = sortStudents(c.eleves);
  const wb = XLSX.utils.book_new();
  const safeSheetName = name => name.replace(/[:\\\/\?\*\[\]]/g,"-").slice(0,31);

  const elevesRows = [["Nom Prénom","Sexe"]];
  sorted.forEach(e=>elevesRows.push([e.nomPrenom, e.sexe||""]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(elevesRows), "Élèves");

  c.seances.forEach(s=>{
    const phase = s.numero<=3 ? "pratique" : "evaluation";
    let rows;
    if(phase==="evaluation" && s.evalConfig){
      const header = ["Groupe","N°","Élève","Figures","Liaisons"];
      if(s.evalConfig.projetCollectif) header.push("Projet collectif");
      header.push("Note globale","Implication","Attitude");
      rows = [header];
      s.groupes.filter(g=>g.membres.length>0).forEach((g,gidx)=>{
        g.membres.forEach((mid,mi)=>{
          const e = c.eleves.find(x=>x.id===mid); if(!e) return;
          const row = [gidx+1, mi+1, e.nomPrenom, seanceGroupTier(s,mid,"nbFigures")||"", seanceGroupTier(s,mid,"liaisons")||""];
          if(s.evalConfig.projetCollectif) row.push(seanceGroupTier(s,mid,"projetCollectif")||"");
          row.push(globalTierForStudent(s,e.id)||"", (s.implication&&s.implication[mid])||"", (s.attitude&&s.attitude[mid])||"");
          rows.push(row);
        });
      });
    } else {
      rows = [["Élève","Statut","Figures validées","Implication","Attitude"]];
      sorted.forEach(e=>{
        const isAbs = s.absents.includes(e.id), isDisp = s.dispenses.includes(e.id);
        const statut = isAbs ? "Absent" : isDisp ? "Dispensé" : "Présent";
        let figCount = "";
        if(!isAbs && !isDisp){
          const g = s.groupes.find(gr=>gr.membres.includes(e.id));
          figCount = g ? countValidations(s,g.id) : 0;
        }
        rows.push([e.nomPrenom, statut, figCount, (s.implication&&s.implication[e.id])||"", (s.attitude&&s.attitude[e.id])||""]);
      });
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), safeSheetName("Séance "+s.numero));
  });

  const gymDefs = LEVEL_DEFAULTS[STATE.niveauActif].gym;
  const gymRows = [["Élève","Roulade avant","Roulade arrière", STATE.niveauActif==='3eme'?"Trépied tenu 3s":"Trépied passager","ATR"]];
  sorted.forEach(e=>{
    gymRows.push([e.nomPrenom,
      c.gym.rouladeAvant.resultats[e.id]||"",
      c.gym.rouladeArriere.resultats[e.id]||"",
      c.gym.trepied.resultats[e.id]||"",
      c.gym.atr.resultats[e.id]||""]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(gymRows), "Éléments gymniques");

  const seancesEval = c.seances.filter(s=>s.evalConfig);
  const recapHeader = ["Élève"].concat(seancesEval.map(s=>"Séance "+s.numero)).concat(["Roulade AV","Roulade AR","Trépied","ATR"]);
  const recapRows = [recapHeader];
  sorted.forEach(e=>{
    const row = [e.nomPrenom];
    seancesEval.forEach(s=>{
      if(s.absents.includes(e.id)) row.push("Abs.");
      else if(s.dispenses.includes(e.id)) row.push("Disp.");
      else row.push(globalTierForStudent(s,e.id)||"");
    });
    ["rouladeAvant","rouladeArriere","trepied","atr"].forEach(k=>row.push(c.gym[k].resultats[e.id]||""));
    recapRows.push(row);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(recapRows), "Récap");

  const d = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, "Acrosport_"+c.nom.replace(/[^a-zA-Z0-9]+/g,"_")+"_"+d+".xlsx");
};

App.importDataFile = function(){ document.getElementById("hiddenFileInput").click(); };
document.getElementById("hiddenFileInput").addEventListener("change", function(e){
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const data = JSON.parse(reader.result);
      if(!data.niveaux) throw new Error("format invalide");
      if(!confirm("Remplacer les données actuelles par celles de ce fichier ?")) return;
      STATE = data;
      save(); render();
    }catch(err){ alert("Fichier invalide : "+err.message); }
  };
  reader.readAsText(f,"UTF-8");
  e.target.value="";
});

App.resetAllConfirm = function(){
  if(!confirm("⚠️ Réinitialiser TOUTES les données (classes, élèves, séances, notes, banque de figures) ? Cette action est irréversible. Pensez à exporter une sauvegarde avant.")) return;
  STATE = freshState();
  save(); render();
};

/* =========================================================================
   INIT
   ========================================================================= */
render();
if(getSyncUrl()){
  App.syncPull(false);
} else {
  save();
}
